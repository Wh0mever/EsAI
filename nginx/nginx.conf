worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  upstream next { server next:3000; }
  upstream core { server core:8000; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # HTTP-only config for local/test (no TLS, no certs)
  server {
    listen 80;
    server_name _;

    # Security headers (HTTP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ACME challenge path (harmless in test, useful if re-used)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      allow all;
    }

    # Static/media served directly
    location /static/ { alias /var/www/static/; access_log off; expires 7d; }

    # Загруженное людьми отдаётся с нашего же домена: HTML/SVG/XML (и .rss,
    # .atom, .kml…) браузер исполнил бы как страницу сайта. Правило обратное
    # перечню опасных расширений — по умолчанию только скачивание и песочница,
    # в браузере показываем лишь картинки, звук, видео и PDF. Подробнее — в
    # nginx-ssl.conf, держать оба файла одинаковыми.
    location ^~ /media/ {
      alias /var/www/media/;
      access_log off;
      expires 7d;
      default_type application/octet-stream;
      add_header Content-Disposition "attachment" always;
      add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "same-origin" always;

      # Свой add_header отменяет унаследованные — заголовки сервера заново.
      location ~* \.(jpe?g|png|gif|webp|avif|bmp|ico|mp3|m4a|ogg|mp4|m4v|webm|mov|pdf)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
      }
    }

    # Свои видео людей в склейке: без кэша — удалённое видео не должно жить в
    # кэше браузера и прокси (подробнее — в nginx-ssl.conf, держать одинаковыми).
    location ^~ /media/merge/uploads/ {
      alias /var/www/media/merge/uploads/;
      access_log off;
      expires off;
      default_type application/octet-stream;
      add_header Cache-Control "private, no-store" always;
      add_header Content-Disposition "attachment" always;
      add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "same-origin" always;

      location ~* \.(jpe?g|mp4|webm)$ {
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
      }
    }

    # Django admin & API
    location /admin/ {
      proxy_pass http://core;
      proxy_connect_timeout 90s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 25m;
    }

    location /api/ {
      proxy_pass http://core;
      proxy_connect_timeout 90s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 25m;
    }

    # Склейка: загрузка своего видео (до 90 МБ; как в nginx-ssl.conf). Тело
    # принимает nginx целиком и отдаёт core одним махом — поток gunicorn не
    # ждёт медленный телефон. Остальной /api/ — 25 МБ.
    location = /api/merge/uploads/ {
      proxy_pass http://core;
      proxy_connect_timeout 90s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_request_buffering on;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 95m;
      client_body_timeout 120s;
    }

    # Next.js frontend
    location / {
      proxy_pass http://next;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
