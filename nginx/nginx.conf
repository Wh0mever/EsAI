worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;

  upstream next { server next:3000; }
  upstream core { server core:8000; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # HTTP (80): serve ACME challenges and redirect everything else to HTTPS
  server {
    listen 80;
    server_name _;

    # Security headers (HTTP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      allow all;
    }

    # Allow static/media on HTTP only for ACME if needed, but generally redirect
    location /static/ { return 301 https://$host$request_uri; }
    location /media/  { return 301 https://$host$request_uri; }

    # Redirect all app traffic to HTTPS
    location / { return 301 https://$host$request_uri; }
  }

  # HTTPS (443): single SAN certificate served for all domains
  server {
    listen 443 ssl;
    http2 on;
    server_name vokalo.online www.vokalo.online vokalo.ru www.vokalo.ru vokalo.kg www.vokalo.kg;

    ssl_certificate     /etc/letsencrypt/live/vokalo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vokalo.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers (HTTPS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /static/ { alias /var/www/static/; access_log off; expires 7d; }
    location /media/  { alias /var/www/media/;  access_log off; expires 7d; }

    location /admin/ {
      proxy_pass http://core;
      proxy_connect_timeout 90s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 25m;
    }

    location /api/ {
      proxy_pass http://core;
      proxy_connect_timeout 90s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 25m;
    }

    location / {
      proxy_pass http://next;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
