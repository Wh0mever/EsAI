worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  upstream next { server next:3000; }
  upstream core { server core:8000; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # HTTP-only config for local/test (no TLS, no certs)
  server {
    listen 80;
    server_name _;

    # Security headers (HTTP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ACME challenge path (harmless in test, useful if re-used)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      allow all;
    }

    # Static/media served directly
    location /static/ { alias /var/www/static/; access_log off; expires 7d; }
    location /media/  { alias /var/www/media/;  access_log off; expires 7d; }

    # Django admin & API
    location /admin/ {
      proxy_pass http://core;
      proxy_connect_timeout 90s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 25m;
    }

    location /api/ {
      proxy_pass http://core;
      proxy_connect_timeout 90s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 25m;
    }

    # Next.js frontend
    location / {
      proxy_pass http://next;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
