worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  upstream next { server next:3000; }
  upstream core { server core:8000; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # HTTP: ACME challenge + redirect everything to HTTPS
  server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      allow all;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS: esai.kg
  server {
    listen 443 ssl;
    http2 on;
    server_name esai.kg www.esai.kg;

    ssl_certificate /etc/letsencrypt/live/esai.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esai.kg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Static / media served directly
    location /static/ { alias /var/www/static/; access_log off; expires 7d; }
    location /media/  { alias /var/www/media/;  access_log off; expires 7d; }

    # Django admin
    location /admin/ {
      proxy_pass http://core;
      proxy_connect_timeout 90s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      client_max_body_size 25m;
    }

    # API (also used for SSE streaming -> disable buffering)
    location /api/ {
      proxy_pass http://core;
      proxy_connect_timeout 90s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      client_max_body_size 25m;
    }

    # Next.js frontend
    location / {
      proxy_pass http://next;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
