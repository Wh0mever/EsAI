worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;

  upstream next { server next:3000; }
  upstream core { server core:8000; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # HTTP: default server, serves ACME for any host and redirects to HTTPS
  server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      allow all;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS: vokalo.kg
  server {
    listen 443 ssl http2;
    server_name vokalo.kg www.vokalo.kg;

    ssl_certificate /etc/letsencrypt/live/vokalo.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vokalo.kg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers (HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Static
    location /static/ { alias /var/www/static/; access_log off; expires 7d; }
    location /media/  { alias /var/www/media/;  access_log off; expires 7d; }

    # Django admin & API
    location /admin/ {
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      client_max_body_size 25m;
    }

    location /api/ {
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      client_max_body_size 25m;
    }

    # Next.js frontend
    location / {
      proxy_pass http://next;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  # HTTPS: vokalo.online
