worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # Адреса контейнеров спрашиваем у docker-DNS на каждом запросе (через
  # переменные в proxy_pass), а не один раз при старте nginx. Со статичным
  # upstream пересоздание core или next давало контейнеру новый IP, и все
  # страницы (или весь /api/) отвечали 502, пока не перезапустишь nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Сайт стоит за Cloudflare: для nginx каждый запрос приходит с адреса
  # Cloudflare, а настоящий адрес человека — в CF-Connecting-IP. Доверяем ему
  # только от сетей Cloudflare (https://www.cloudflare.com/ips/). Дальше в
  # приложение уходит ровно один адрес: раньше X-Forwarded-For дописывался к
  # присланному клиентом, и подставной адрес обходил гостевую квоту чата,
  # лимиты входа и чёрный список.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # HTTP: ACME challenge + redirect everything to HTTPS
  server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      allow all;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS: www.esai.kg -> apex (301). Канонический домен один — esai.kg.
  # Сертификат esai.kg покрывает www (SAN: esai.kg, www.esai.kg), отдельный
  # cert не нужен. Без этого www отдавал 200 → дубль контента для Google.
  server {
    listen 443 ssl;
    http2 on;
    server_name www.esai.kg;

    ssl_certificate /etc/letsencrypt/live/esai.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esai.kg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    return 301 https://esai.kg$request_uri;
  }

  # HTTPS: esai.kg (канонический домен, default_server для 443)
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name esai.kg;

    set $core_up http://core:8000;
    set $next_up http://next:3000;

    ssl_certificate /etc/letsencrypt/live/esai.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esai.kg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Static / media served directly
    location /static/ { alias /var/www/static/; access_log off; expires 7d; }

    # Загруженное людьми (вложения чата, герои, звук) отдаётся с нашего же
    # домена. Всё, что браузер умеет открыть как документ (HTML, SVG, XML, а с
    # ним .rss, .atom, .kml и прочие *+xml), исполнило бы скрипт на esai.kg — и
    # тот прочёл бы токены входа того, кто открыл ссылку. Перечислять опасные
    # расширения — всегда что-то забыть, поэтому правило обратное: по умолчанию
    # файл отдаётся только на скачивание и в песочнице без скриптов, а в
    # браузере показываем лишь картинки, звук, видео и PDF. Это закрывает и
    # файлы, загруженные до проверки расширений в загрузке чата.
    # Тип не трогаем: SVG в <img> показывается и с Content-Disposition.
    # ^~ — чтобы regex-location уровня server не перехватил /media/.
    location ^~ /media/ {
      alias /var/www/media/;
      access_log off;
      expires 7d;
      # Неизвестное расширение — просто байты, а не text/plain.
      default_type application/octet-stream;
      add_header Content-Disposition "attachment" always;
      add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "same-origin" always;

      # Эти типы браузер показывает сам, скриптов в них нет. Заголовки
      # перечислены заново: свой add_header отменяет унаследованные, иначе сюда
      # пришли бы attachment и sandbox (PDF в песочнице Chrome не открывает).
      location ~* \.(jpe?g|png|gif|webp|avif|bmp|ico|mp3|m4a|ogg|mp4|m4v|webm|mov|pdf)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
      }
    }

    # Свои видео людей в склейке (и их обложки): ссылку знает только владелец
    # (имя — случайный uid, списка нет), но удалённое или истёкшее видео не
    # должно жить дальше в кэше Cloudflare (mp4 и webm он кэширует сам, а
    # /media/ идёт с expires 7d) и в кэше браузера — здесь без кэша.
    # Остальное — как у /media/ выше; ^~ и длинный префикс берут эти файлы себе.
    location ^~ /media/merge/uploads/ {
      alias /var/www/media/merge/uploads/;
      access_log off;
      expires off;
      default_type application/octet-stream;
      add_header Cache-Control "private, no-store" always;
      add_header Content-Disposition "attachment" always;
      add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "same-origin" always;

      location ~* \.(jpe?g|mp4|webm)$ {
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
      }
    }

    # Звук склейки (голос, музыка, свой трек — mp3): так же без кэша, как свои
    # видео выше: удалённая или истёкшая дорожка не должна жить в кэше
    # Cloudflare (mp3 он кэширует сам) и браузера.
    location ^~ /media/merge/audio/ {
      alias /var/www/media/merge/audio/;
      access_log off;
      expires off;
      default_type application/octet-stream;
      add_header Cache-Control "private, no-store" always;
      add_header Content-Disposition "attachment" always;
      add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "same-origin" always;

      location ~* \.mp3$ {
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
      }
    }

    # Django admin
    location /admin/ {
      proxy_pass $core_up;
      proxy_connect_timeout 90s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      client_max_body_size 25m;
    }

    # API (also used for SSE streaming -> disable buffering)
    location /api/ {
      proxy_pass $core_up;
      proxy_connect_timeout 90s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      client_max_body_size 25m;
    }

    # Склейка: загрузка своего видео (до 90 МБ, Cloudflare Free пропускает
    # тело до 100 МБ). Остальной /api/ остаётся с пределом 25 МБ. Тело целиком
    # принимает nginx (на диск) и только потом отдаёт core одним махом: телефон
    # на медленной сети грузит минуты, и всё это время держал бы поток gunicorn.
    # client_body_timeout — пауза между двумя порциями тела, не вся загрузка.
    location = /api/merge/uploads/ {
      proxy_pass $core_up;
      proxy_connect_timeout 90s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_request_buffering on;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      client_max_body_size 95m;
      client_body_timeout 120s;
    }

    # Статика Next со СВОЕЙ папки, куда деплой докладывает каждую сборку, не
    # удаляя прошлые. Зачем: имена файлов содержат хэш, и при выкладке старые
    # исчезали вместе с контейнером. Пользователь, у которого страница осталась
    # от прошлой сборки (кэш браузера, service worker, предзагрузка из поиска),
    # запрашивал свой css и получал 404 — сайт открывался вообще без стилей.
    # Чего нет на диске — уходит в приложение, так что новая сборка работает
    # даже до того, как копия доедет.
    location /_next/static/ {
      alias /var/www/next-static/;
      access_log off;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri @next_app;
    }

    location @next_app {
      proxy_pass $next_up;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Mini App Telegram: страница открывается в iframe web.telegram.org и в
    # WebView приложений. Заголовки здесь перечислены заново: add_header в
    # location отменяет наследование, и X-Frame-Options сюда не попадает —
    # вместо него frame-ancestors с доменами Telegram.
    location /tg/ {
      proxy_pass $next_up;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "same-origin" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    }

    # Вебхук бота (BOT_MODE=webhook). Адрес контейнера берётся через
    # переменную и docker-DNS, чтобы nginx поднимался и без сервиса bot.
    # Пускаем только сети Telegram.
    location /tg-webhook/ {
      allow 149.154.160.0/20;
      allow 91.108.4.0/22;
      deny all;
      resolver 127.0.0.11 valid=10s;
      set $bot_upstream http://bot:8081;
      proxy_pass $bot_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 30s;
    }

    # Next.js frontend
    location / {
      proxy_pass $next_up;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
