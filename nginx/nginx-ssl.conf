  # HTTPS: vokalo.ru
  server {
    listen 443 ssl http2;
    server_name vokalo.ru www.vokalo.ru;

    ssl_certificate /etc/letsencrypt/live/vokalo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vokalo.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers (HTTPS)
