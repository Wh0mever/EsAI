services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [web]

  # Redis брокер/бэкенд для Celery
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379" # можно убрать наружу, если не нужно с хоста
    networks: [web]

  core:
    user: "0:0"
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # эти переменные удобно пробрасывать в settings.py через os.getenv
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static:/app/static
      - media:/app/media
    expose:
      - "8000"
    restart: always
    networks: [web]

  # Celery worker
  celery:
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      C_FORCE_ROOT: "1"  # если запускаешь под root внутри контейнера
    command: >
      sh -lc "celery -A core worker
      --loglevel=INFO
      --concurrency=${CELERY_CONCURRENCY:-2}
      --pidfile=/tmp/celery.pid"
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - static:/app/static
      - media:/app/media
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery.pid && kill -0 $(cat /tmp/celery.pid)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]

  # Celery Beat (по необходимости; можно удалить, если не нужен)
  celery_beat:
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    command: >
      sh -lc "celery -A core beat
      --loglevel=INFO
      --pidfile=/tmp/celerybeat.pid
      --scheduler django_celery_beat.schedulers:DatabaseScheduler || true"
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]

  next:
    build:
      context: ./next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_CONFIG: ${NEXT_CONFIG:-next.config.ts}
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - core
    expose:
      - "3000"
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000', r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - next
      - core
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
    ports:
      - "80:80"
    restart: always
    networks: [web]

volumes:
  pgdata:
  static:
  media:

networks:
  web:
    driver: bridge
