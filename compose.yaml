# Логи контейнеров (stdout gunicorn, next, nginx) по умолчанию растут без
# предела и однажды съедают диск. Держим пять файлов по 20 МБ на сервис.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [web]

  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks: [web]

  core:
    logging: *default-logging
    user: "0:0"
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      # Потоки в каждом из трёх процессов gunicorn. Синхронный воркер держал
      # целый процесс на каждый ответ чата (SSE) и на каждую генерацию картинки
      # или видео внутри запроса — три таких запроса, и вход, оплаты и весь
      # остальной API ждали минутами.
      GUNICORN_CMD_ARGS: ${GUNICORN_CMD_ARGS:---worker-class gthread --threads 8}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./static:/app/static
      - ./media:/app/media
      - ./logs:/app/logs
      - ./core:/app
    expose:
      - "8000"
    restart: always
    networks: [web]

  celery:
    logging: *default-logging
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      C_FORCE_ROOT: "1"
      # Миграции и статику делает только core: четыре одновременных migrate
      # при старте могли дважды применить одну миграцию данных.
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: >
      sh -lc "celery -A core worker
      --loglevel=${CELERY_LOG_LEVEL:-INFO}
      --logfile=/app/logs/celery.log
      --concurrency=${CELERY_CONCURRENCY:-2}
      --pidfile=/tmp/celery.pid"
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./static:/app/static
      - ./media:/app/media
      # Share the same logs directory so Celery writes to host-mounted logs
      - ./logs:/app/logs
      # Код — с диска, как у core. Запечённый в образ код жил своей жизнью:
      # после обычной выкладки воркер молча крутил старые задачи и старый
      # биллинг, пока не пересоберёшь образ. Теперь хватает рестарта.
      - ./core:/app
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery.pid && kill -0 $(cat /tmp/celery.pid)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]

  # Отдельный воркер для долгих задач: видео из бота и сцены студии. В общей
  # очереди десятиминутный ролик задерживал бы письма, бонусы и уведомления.
  celery_media:
    logging: *default-logging
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      C_FORCE_ROOT: "1"
      # Миграции и статику делает только core: четыре одновременных migrate
      # при старте могли дважды применить одну миграцию данных.
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: >
      sh -lc "celery -A core worker
      -Q ${CELERY_MEDIA_QUEUE:-media}
      --loglevel=${CELERY_LOG_LEVEL:-INFO}
      --logfile=/app/logs/celery_media.log
      --concurrency=${CELERY_MEDIA_CONCURRENCY:-3}
      --pidfile=/tmp/celery_media.pid"
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./static:/app/static
      - ./media:/app/media
      - ./logs:/app/logs
      - ./core:/app
    restart: always
    # Сцена снимается до ~10 минут. По умолчанию docker ждёт 10 секунд и
    # убивает воркер — каждая выкладка обрывала съёмки, за которые провайдер
    # уже взял деньги. Celery на SIGTERM дорабатывает начатое.
    stop_grace_period: 12m
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery_media.pid && kill -0 $(cat /tmp/celery_media.pid)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]

  # Воркер видеостудии: отправка, опрос и выдача дублей, картинки для @.
  # Задачи короткие, но отправка ждёт провайдера до 150 с, а в media три слота
  # держат сцены мультстудии до получаса — поэтому своя очередь. Страховка
  # sweep_takes идёт в общую очередь (воркер celery) и работает без этого.
  celery_vstudio:
    logging: *default-logging
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      C_FORCE_ROOT: "1"
      # Миграции и статику делает только core: четыре одновременных migrate
      # при старте могли дважды применить одну миграцию данных.
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: >
      sh -lc "celery -A core worker
      -Q ${CELERY_VSTUDIO_QUEUE:-vstudio}
      --pool=prefork
      --loglevel=${CELERY_LOG_LEVEL:-INFO}
      --logfile=/app/logs/celery_vstudio.log
      --concurrency=${CELERY_VSTUDIO_CONCURRENCY:-4}
      --pidfile=/tmp/celery_vstudio.pid"
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./static:/app/static
      - ./media:/app/media
      - ./logs:/app/logs
      - ./core:/app
    restart: always
    # Самая долгая задача — выдача ролика (до 300 с): на SIGTERM Celery
    # доделывает начатое, и выкладка не обрывает скачивание оплаченного видео.
    # Что не успело — подберёт sweep_takes по истёкшей аренде.
    stop_grace_period: 5m
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery_vstudio.pid && kill -0 $(cat /tmp/celery_vstudio.pid)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]

  celery_beat:
    logging: *default-logging
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: >
      sh -lc "celery -A core beat
      --loglevel=${CELERY_LOG_LEVEL:-INFO}
      --logfile=/app/logs/celery_beat.log
      --pidfile=/tmp/celerybeat.pid
      --scheduler django_celery_beat.schedulers:DatabaseScheduler || true"
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]
    volumes:
      # Celery beat may also emit logs via Django logging config
      - ./logs:/app/logs
      - ./core:/app

  next:
    logging: *default-logging
    build:
      context: ./next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_CONFIG: ${NEXT_CONFIG:-next.config.ts}
        # Expose FreedomPay vars at build-time so Next can inline them
        # (fallbacks stay empty if not defined; runtime still injects via server env)
        NEXT_PUBLIC_FREEDOM_PAY_PUBLIC_KEY: ${NEXT_PUBLIC_FREEDOM_PAY_PUBLIC_KEY:-}
        NEXT_PUBLIC_FREEDOM_PAY_TOKEN: ${NEXT_PUBLIC_FREEDOM_PAY_TOKEN:-}
        FREEDOM_PAY_PUBLIC_KEY: ${FREEDOM_PAY_PUBLIC_KEY:-}
        FREEDOM_PAY_TOKEN: ${FREEDOM_PAY_TOKEN:-}
        NEXT_PUBLIC_FREEDOM_PAY_MERCHANT_ID: ${NEXT_PUBLIC_FREEDOM_PAY_MERCHANT_ID:-}
        FREEDOM_PAY_MERCHANT_ID: ${FREEDOM_PAY_MERCHANT_ID:-}
        NEXT_PUBLIC_FREEDOM_PAY_TEST: ${NEXT_PUBLIC_FREEDOM_PAY_TEST:-}
        FREEDOM_PAY_TEST: ${FREEDOM_PAY_TEST:-}
        # Пункт «Видеостудия» в меню, sitemap и индексация /video-studio.
        # Ставить 1 только вместе с VSTUDIO_MODE=on на бэкенде.
        NEXT_PUBLIC_VSTUDIO_NAV: ${NEXT_PUBLIC_VSTUDIO_NAV:-}
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # middleware.ts обновляет токен входа напрямую у core, мимо Cloudflare.
      INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://core:8000}
      # Ensure runtime access for API route and window.__FP_ENV__ injection
      FREEDOM_PAY_PUBLIC_KEY: ${FREEDOM_PAY_PUBLIC_KEY}
      FREEDOM_PAY_TOKEN: ${FREEDOM_PAY_TOKEN}
      FREEDOM_PAY_MERCHANT_ID: ${FREEDOM_PAY_MERCHANT_ID:-}
      FREEDOM_PAY_TEST: ${FREEDOM_PAY_TEST:-}
    depends_on:
      - core
    expose:
      - "3000"
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000', r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]

  bot:
    logging: *default-logging
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file: .env
    environment:
      # Ходим прямо в core внутри сети: nginx и TLS тут лишние.
      BOT_API_BASE: "http://core:8000"
      BOT_PUBLIC_HOST: "esai.kg"
      BOT_REDIS_URL: "redis://redis:6379/3"
      BOT_MODE: "${BOT_MODE:-polling}"
      BOT_LOG_FILE: "/app/logs/bot.log"
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    restart: always
    stop_grace_period: 30s
    networks: [web]

  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    depends_on:
      - core
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/var/www/static:ro
      - ./media:/var/www/media:ro
      - certbot-var:/var/www/certbot
      # Expose nginx logs to host
      - ./logs:/var/log/nginx
    ports:
      - "80:80"
    restart: always
    networks: [web]

  certbot:
    image: certbot/certbot:latest
    # Nginx must be up on :80 so webroot challenge can be served
    depends_on:
      - nginx
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    networks: [web]

volumes:
  pgdata:
  redisdata:
  certbot-etc:
  certbot-var:

networks:
  web:
    driver: bridge
