services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [web]

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks: [web]

  core:
    user: "0:0"
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env
    environment:

      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static:/app/static
      - media:/app/media
      # Expose Django/core logs to host
      - ./logs:/app/core/logs
    expose:
      - "8000"
    restart: always
    networks: [web]

  celery:
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      C_FORCE_ROOT: "1"
    command: >
      sh -lc "celery -A core worker
      --loglevel=INFO
      --concurrency=${CELERY_CONCURRENCY:-2}
      --pidfile=/tmp/celery.pid"
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - static:/app/static
      - media:/app/media
      # Share the same logs directory so Celery writes to host-mounted logs
      - ./logs:/app/core/logs
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery.pid && kill -0 $(cat /tmp/celery.pid)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]

  celery_beat:
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    command: >
      sh -lc "celery -A core beat
      --loglevel=INFO
      --pidfile=/tmp/celerybeat.pid
      --scheduler django_celery_beat.schedulers:DatabaseScheduler || true"
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]
    volumes:
      # Celery beat may also emit logs via Django logging config
      - ./logs:/app/core/logs

  next:
    build:
      context: ./next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_CONFIG: ${NEXT_CONFIG:-next.config.ts}
        # Expose FreedomPay vars at build-time so Next can inline them
        # (fallbacks stay empty if not defined; runtime still injects via server env)
        NEXT_PUBLIC_FREEDOM_PAY_PUBLIC_KEY: ${NEXT_PUBLIC_FREEDOM_PAY_PUBLIC_KEY:-}
        NEXT_PUBLIC_FREEDOM_PAY_TOKEN: ${NEXT_PUBLIC_FREEDOM_PAY_TOKEN:-}
        FREEDOM_PAY_PUBLIC_KEY: ${FREEDOM_PAY_PUBLIC_KEY:-}
        FREEDOM_PAY_TOKEN: ${FREEDOM_PAY_TOKEN:-}
        NEXT_PUBLIC_FREEDOM_PAY_MERCHANT_ID: ${NEXT_PUBLIC_FREEDOM_PAY_MERCHANT_ID:-}
        FREEDOM_PAY_MERCHANT_ID: ${FREEDOM_PAY_MERCHANT_ID:-}
        NEXT_PUBLIC_FREEDOM_PAY_TEST: ${NEXT_PUBLIC_FREEDOM_PAY_TEST:-}
        FREEDOM_PAY_TEST: ${FREEDOM_PAY_TEST:-}
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Ensure runtime access for API route and window.__FP_ENV__ injection
      FREEDOM_PAY_PUBLIC_KEY: ${FREEDOM_PAY_PUBLIC_KEY}
      FREEDOM_PAY_TOKEN: ${FREEDOM_PAY_TOKEN}
      FREEDOM_PAY_MERCHANT_ID: ${FREEDOM_PAY_MERCHANT_ID:-}
      FREEDOM_PAY_TEST: ${FREEDOM_PAY_TEST:-}
    depends_on:
      - core
    expose:
      - "3000"
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000', r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - core
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
      - certbot-var:/var/www/certbot
      # Expose nginx logs to host
      - ./logs:/var/log/nginx
    ports:
      - "80:80"
    restart: always
    networks: [web]

  certbot:
    image: certbot/certbot:latest
    # Nginx must be up on :80 so webroot challenge can be served
    depends_on:
      - nginx
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    networks: [web]

volumes:
  pgdata:
  static:
  media:
  certbot-etc:
  certbot-var:

networks:
  web:
    driver: bridge
