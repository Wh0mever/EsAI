<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify your email</title>
  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      text-align: center;
    }
    .code {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 6px;
      color: #333333;
      background-color: #eeeeee;
      padding: 10px 20px;
      display: inline-block;
      margin-top: 20px;
      border-radius: 6px;
    }
    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #999999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Verify your email address</h2>
    <p>To confirm your email, please use the 6-digit code below:</p>
    <div class="code">{{ code }}</div>
    <p>This code will expire in 10 minutes.</p>

    <div class="footer">
      If you didn’t request this, you can safely ignore this email.
    </div>
  </div>
</body>
</html>
